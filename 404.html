<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Under Construction | Strippr</title>
  <meta name="robots" content="noindex, follow">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, #3b82f6 100%);
      --accent-glow: rgba(236, 72, 153, 0.25);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-family);
      text-align: center;
      padding: 2rem 1.5rem;
      background-image: radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.1) 0%, transparent 60%);
    }

    .error-code {
      font-size: clamp(4rem, 15vw, 8rem);
      font-weight: 900;
      line-height: 1;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(1.4rem, 1rem + 1.5vw, 2.2rem);
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 2rem;
      font-size: 1rem;
      line-height: 1.6;
    }

    .home-btn {
      display: inline-block;
      padding: 0.85rem 1.75rem;
      border-radius: 10px;
      background: var(--accent-gradient);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: transform 0.15s, opacity 0.2s;
    }

    .home-btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <h1>Feature Under Construction</h1>
  <p>
    This section of Strippr is currently being prepared for platform launch. Please check back soon or return to the main page.
  </p>
  <a href="/" class="home-btn">Return to Home</a>
</body>
</html>
